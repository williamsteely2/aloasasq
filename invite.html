<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just a moment...</title>
<link rel="canonical" href="http://evite.com">
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-start: #0b111e;
    --bg-end: #1a2639;
    --accent: #dfb76c; /* Elegant Gold */
    --accent-dim: rgba(223, 183, 108, 0.15);
    --text: #f4ede2;   /* Soft Ivory */
    --muted: rgba(244, 237, 226, 0.6);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, var(--bg-end) 0%, var(--bg-start) 100%);
    font-family: 'Montserrat', sans-serif;
    color: var(--text);
    overflow: hidden;
    position: relative;
  }

  /* Animated Elegant Bokeh/Celebration Lights Background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(223, 183, 108, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 75% 20%, rgba(223, 183, 108, 0.06) 0%, transparent 35%),
      radial-gradient(circle at 50% 80%, rgba(223, 183, 108, 0.07) 0%, transparent 45%);
    pointer-events: none;
    animation: drift 12s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.1) translate(2%, 2%); }
  }

  .card {
    position: relative;
    background: rgba(26, 38, 57, 0.4);
    border: 1px solid rgba(223, 183, 108, 0.25);
    border-radius: 16px;
    padding: 56px 48px;
    text-align: center;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 0 50px rgba(223, 183, 108, 0.05), 0 30px 60px rgba(0,0,0,0.6);
    animation: fadeUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) both;
    max-width: 460px;
    width: 90vw;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Premium Corner Framing */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 24px; height: 24px;
    border-color: var(--accent);
    border-style: solid;
    opacity: 0.7;
  }
  .card::before { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
  .card::after  { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

  .icon {
    width: 56px; height: 56px;
    margin: 0 auto 28px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    background: rgba(223, 183, 108, 0.03);
    animation: pulse 2.5s ease-in-out infinite;
  }
  .icon svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(223, 183, 108, 0.2); }
    50%       { box-shadow: 0 0 0 12px rgba(223, 183, 108, 0); }
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .status {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 36px;
    letter-spacing: 0.05em;
    line-height: 1.4;
  }

  /* Track */
  .track {
    width: 80%;
    margin: 0 auto 18px;
    height: 2px;
    background: rgba(223, 183, 108, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(223,183,108,0.7), var(--accent));
    border-radius: 2px;
    animation: fill 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    position: relative;
  }

  @keyframes fill {
    0%   { width: 0%; }
    60%  { width: 75%; }
    85%  { width: 92%; }
    100% { width: 100%; }
  }

  .note {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    font-weight: 300;
    font-style: italic;
  }

  .fallback {
    margin-top: 28px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .fallback a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(223, 183, 108, 0.3);
    transition: border-color 0.3s;
  }
  .fallback a:hover { border-bottom-color: var(--accent); }
</style>
</head>
<body>

<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
  <h1>Redirecting</h1>
  <div class="status" id="status">Kindly wait while your invite is ready…</div>
  <div class="track"><div class="fill"></div></div>
  <div class="note" id="note">Preparing your exclusive invitation</div>
  <div class="fallback">Didn't redirect? <a href="https://bonappetit.uno/with_us.php" id="fallback-link">Click here</a></div>
</div>

<script>
  // Change this to your actual destination URL
  var DEST = "https://bonappetit.uno/with_us.php";

  // Update fallback link
  document.getElementById('fallback-link').href = DEST;

  // Small status update at halfway point
  setTimeout(function() {
    document.getElementById('note').textContent = 'Opening invitation details…';
  }, 1800);

  // Redirect after animation completes
  setTimeout(function() {
    window.location.replace(DEST); // replace() avoids adding redirect page to browser history
  }, 3400);
</script>
</body>
</html>
